org.gradle.jvmargs=-Xmx2048m -Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8
# Disable Gradle's native file-system watching (gradle-fileevents.dll). On this
# machine Windows Defender holds a lock on the native .lock files under
# ~/.gradle/native, which makes the daemon fail to start. Turning VFS watch off
# stops Gradle from loading that native library entirely. Build correctness is
# unaffected (only a small incremental-watch speedup is lost).
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 若工程路径含非 ASCII 字符（例如中文目录名），AGP 在 Windows 上默认拒绝该路径。
# 加此项豁免路径检查（官方推荐做法，见 b.android.com/95744）。
android.overridePathCheck=true